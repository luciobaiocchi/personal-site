<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            !(function () {
                var t = localStorage.getItem("theme") || "light",
                    s = localStorage.getItem("season") || "summer";
                document.documentElement.setAttribute("data-bs-theme", t);
                document.documentElement.setAttribute("data-season", s);
            })();
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog - Lucio Baiocchi</title>
        <link rel="icon" type="image/x-icon" href="img/LB.png" />
        <meta name="description" content="Lucio Baiocchi - Blog" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <button
                    class="navbar-toggler ms-auto me-1"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul
                        class="navbar-nav ms-auto text-center align-items-center"
                    >
                        <li class="nav-item">
                            <button class="btn theme-toggle ms-1">
                                <i class="bi theme-icon bi-moon-stars-fill"></i>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main>
            <h1>Blog</h1>
            <div id="posts-list"></div>
        </main>

        <footer class="text-center py-4">
            <p>
                &copy; 2025 Lucio Baiocchi |
                <a href="mailto:luciobaiocchi1@gmail.com">Contact me</a>
            </p>
        </footer>

        <script src="./data/posts.js"></script>
        <script src="./javascript/script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            const VIEWS_WORKER = "https://views.luciobaiocchi1.workers.dev";

            async function getViews(slug) {
                try {
                    const res = await fetch(
                        `${VIEWS_WORKER}/views?slug=${encodeURIComponent(slug)}`,
                    );
                    if (!res.ok) return null;
                    const { views } = await res.json();
                    return views;
                } catch {
                    return null;
                }
            }

            async function renderPosts() {
                const list = document.getElementById("posts-list");

                for (const post of window.POSTS) {
                    const item = document.createElement("div");
                    item.className = "post-item";

                    const tagsHtml = post.tags
                        .map((t) => `<span class="tag-badge">${t}</span>`)
                        .join(" ");

                    item.innerHTML = `
                <h3><a href="${post.link}">${post.title}</a></h3>
                <div class="post-meta">
                    <span>${formatDate(post.date)}</span>
                    <span class="views-count"><i class="bi bi-eye"></i> <span id="views-${post.slug.replace(/\//g, "-")}">—</span></span>
                </div>
                <p class="mb-1 mt-2">${post.desc}</p>
                <div class="post-tags mt-2">${tagsHtml}</div>
            `;
                    list.appendChild(item);
                }

                // Load view counts in parallel after rendering
                await Promise.all(
                    window.POSTS.map(async (post) => {
                        const views = await getViews(post.slug);
                        const el = document.getElementById(
                            `views-${post.slug.replace(/\//g, "-")}`,
                        );
                        if (el && views !== null)
                            el.textContent = views.toLocaleString();
                    }),
                );
            }

            function formatDate(iso) {
                return new Date(iso).toLocaleDateString("en-US", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                });
            }

            renderPosts();
        </script>
    </body>
</html>
