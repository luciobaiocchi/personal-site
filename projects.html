    <style>
        .project-item {
            padding: 1.5rem 0;

        .project-item h3 a {
            color: var(--text-color);
            transition: color 0.2s;
        }
        .project-item h3 a:hover {
            color: var(--primary-color);
        }
        .tech-icons {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
            opacity: 0.7;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <button class="navbar-toggler ms-auto me-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contacts">Contacts</a></li>

                        <button class="btn theme-toggle ms-1">
                            <i class="bi theme-icon bi-moon-stars-fill"></i>

                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <h1>Projects</h1>
        <div id="projects-list"></div>
    </main>

    <footer class="text-center py-4">
        <p>&copy; 2025 Lucio Baiocchi | <a href="mailto:luciobaiocchi1@gmail.com">Contact me</a></p>
    </footer>

    <script src="./javascript/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const PROJECTS = [
        { title: "Nxord", desc: "Full-stack B2B platform that automates HoReCa order management with multimodal AI — any format (PDF, photo, audio) converted to structured ERP-ready records. In production.", link: "./projects/nxord.html", tech: ["fa-brands fa-python", "fa-brands fa-react", "fa-brands fa-docker"], external: "https://nxord.com/" },
        { title: "Bakery Anomaly Detection", desc: "Rolling Z-score with conjunction rule for production order error detection in an artisanal bakery — 2 months in production, F1 85.7% without oracle selection. Paper in preparation for SOMI @ ECML-PKDD 2026.", link: "./projects/bakery_anomaly.html", tech: ["fa-brands fa-python"] },
        { title: "PCA Psychophysical Analysis", desc: "PCA + K-Means on 93 behavioral variables — surfaced 4 psychophysical profiles from a dataset of human subjects.", link: "./projects/pca_analysis.html", tech: ["fa-brands fa-python"] },
        { title: "Numerical Optimization", desc: "Implemented Modified & Truncated Newton solvers with sparse Hessian ops — solved 100k-variable problems in under 0.5s.", link: "./projects/nm_optimization.html", tech: ["fa-brands fa-python"] },
        { title: "LSA with rSVD", desc: "Custom randomized SVD on 18k Usenet posts — topic clustering with Silhouette scoring and an interactive semantic search GUI.", link: "./projects/lsa_rsvd.html", tech: ["fa-brands fa-python"] },
        { title: "Newspaper Classificator", desc: "End-to-end NLP classification pipeline — ranked 3rd out of 200 competing teams.", link: "./projects/newspaper_classificator.html", tech: ["fa-brands fa-python"] },
        { title: "Heard", desc: "MSc thesis — real-time spatial audio rendering on embedded hardware in C.", link: "./projects/thesis.html", tech: ["fa-sharp fa-solid fa-c"] },
        { title: "Giogreens", desc: "Full-stack plant e-commerce — PHP REST API, JS frontend, MySQL, Docker Compose.", link: "./projects/giogreens.html", tech: ["fa-brands fa-js", "fa-brands fa-php", "fa-brands fa-bootstrap", "fa-brands fa-docker", "fas fa-database"] },
        { title: "My Diet", desc: "Java desktop nutrition tracker with graph-based meal planning and SQLite persistence.", link: "./projects/mydiet.html", tech: ["fab fa-java", "fas fa-database"] },
        { title: "Gym Life", desc: "2D retro gym simulation game — fully built in Java with custom physics and sprite engine.", link: "./projects/gymlife.html", tech: ["fab fa-java"] },
        { title: "IOT Projects", desc: "Multi-platform IoT systems — embedded C sensors, Java middleware, Python analytics.", link: "./projects/iot_projects.html", tech: ["fab fa-java", "fa-brands fa-python", "fa-sharp fa-solid fa-c"] },
        { title: "Chat-Python", desc: "Multi-user TCP chat — socket programming with threading and user session management.", link: "./projects/chat_python.html", tech: ["fa-brands fa-python"] },
        { title: "DVRS", desc: "Bellman-Ford distance vector routing simulator with convergence visualization.", link: "./projects/dvrs.html", tech: ["fa-brands fa-python"] },
        { title: "Algorithms Course Project", desc: "Dijkstra shortest-path solver on large city graphs — custom heap in C.", link: "./projects/algorithm.html", tech: ["fa-sharp fa-solid fa-c"] },
    ];

    const list = document.getElementById("projects-list");
    PROJECTS.forEach((p, i) => {
        const item = document.createElement("div");
        item.className = "project-item";
        const num = String(i + 1).padStart(2, '0');
        const externalLink = p.external ? ` <a href="${p.external}" target="_blank" class="ms-2 text-decoration-none text-secondary" style="font-size:0.8rem;">↗</a>` : "";
        item.innerHTML = `
            <h3><span class="project-num">${num}</span><a href="${p.link}" class="text-decoration-none">${p.title}</a>${externalLink}</h3>
            <p class="mb-1">${p.desc}</p>
            <div class="tech-icons">${p.tech.map(cls => `<i class="${cls}"></i>`).join("")}</div>
        `;
        list.appendChild(item);
    });
    </script>
</body>
</html>
