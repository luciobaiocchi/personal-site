        <main>
            <h1>Projects</h1>
            <p class="text-secondary">Things I have built for work, university, and the fun of figuring out how they work.</p>
            <div id="projects-list"></div>
        </main>

        <footer class="text-center py-4">

                &copy; 2026 Lucio Baiocchi |

        <script src="./javascript/script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            const PROJECTS = [
                {
                    title: "Towel (twl)",
                    desc: "I built Towel to stop handing real API keys to coding agents. A small Rust broker keeps each credential in a trusted process and only sends it to the destination I configured.",
                    link: "./projects/twl.html",
                    tech: [
                        "fa-brands fa-rust",
                        "fa-solid fa-shield-halved",
                        "fa-solid fa-key",
                    ],
                    external: [
                        {
                            label: "site",
                            href: "https://luciobaiocchi.github.io/twl/",
                        },
                        {
                            label: "github",
                            href: "https://github.com/luciobaiocchi/twl",
                        },
                    ],
                },
                {
                    title: "HEARD",
                    desc: "My bachelor's thesis became an open-hardware project: handheld LoRa devices that help a hiking group stay on route, relay positions, and send an SOS when there is no phone signal.",
                    link: "./heard.html",
                    tech: [
                        "fa-sharp fa-solid fa-c",
                        "fa-solid fa-tower-broadcast",
                        "fa-solid fa-cube",
                    ],
                    external: [
                        {
                            label: "github",
                            href: "https://github.com/luciobaiocchi/heard",
                        },
                    ],
                },
                {
                    title: "Nxord",
                    desc: "A platform I co-founded and built for a food distributor. It reads orders from PDFs, photos, email, or audio, matches the products, and prepares the result for their ERP.",
                    link: "./projects/nxord.html",
                    tech: [
                        "fa-brands fa-python",
                        "fa-brands fa-react",
                        "fa-brands fa-docker",
                    ],
                    external: [
                        { label: "nxord.com", href: "https://nxord.com/" },
                    ],
                },
                {
                    title: "MedicAId",
                    desc: "A five-hour hackathon prototype that puts a simulated Italian health record behind a WhatsApp chat, including reminders, appointments, prescriptions, and caregiver access.",
                    link: "./projects/medicaid.html",
                    tech: ["fa-brands fa-python", "fa-brands fa-whatsapp"],
                },
                {
                    title: "Bakery Anomaly Detection",
                    desc: "I built this with an artisanal bakery to catch suspicious production quantities before the morning shift starts. A simple rolling Z-score proved more useful here than a trained model.",
                    link: "./projects/bakery_anomaly.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "PCA Psychophysical Analysis",
                    desc: "A course project where I reduced 93 behavioural variables with PCA, then used K-Means to explore four broad profiles in the dataset.",
                    link: "./projects/pca_analysis.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "Numerical Optimization",
                    desc: "For a numerical optimization course, I implemented Modified and Truncated Newton solvers and tested them on sparse problems with up to 100,000 variables.",
                    link: "./projects/nm_optimization.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "LSA with rSVD",
                    desc: "I wrote a randomized SVD implementation and used it to cluster about 18,000 Usenet posts, with a small desktop interface for semantic search.",
                    link: "./projects/lsa_rsvd.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "Newspaper Classifier",
                    desc: "A news-classification challenge at Politecnico di Torino. The pipeline placed 3rd among 200 groups with a macro F1 score of 0.741.",
                    link: "./projects/newspaper_classificator.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "Giogreens",
                    desc: "A web technologies course project: a plant shop with a PHP API, plain JavaScript frontend, MySQL database, and separate customer and admin flows.",
                    link: "./projects/giogreens.html",
                    tech: [
                        "fa-brands fa-js",
                        "fa-brands fa-php",
                        "fa-brands fa-bootstrap",
                        "fa-brands fa-docker",
                        "fas fa-database",
                    ],
                },
                {
                    title: "My Diet",
                    desc: "A Java desktop app from a database course. It connects clients and nutritionists around meal plans, progress tracking, and a MySQL database.",
                    link: "./projects/mydiet.html",
                    tech: ["fab fa-java", "fas fa-database"],
                },
                {
                    title: "Gym Life",
                    desc: "A small 2D Java game about balancing training, energy, and mood. We drew the sprites and built the game loop and collision handling ourselves.",
                    link: "./projects/gymlife.html",
                    tech: ["fab fa-java"],
                },
                {
                    title: "IoT Projects",
                    desc: "Three hands-on embedded projects: a binary game, a smart bin, and a networked window controller built with Arduino, ESP32, Java, and Python.",
                    link: "./projects/iot_projects.html",
                    tech: [
                        "fab fa-java",
                        "fa-brands fa-python",
                        "fa-sharp fa-solid fa-c",
                    ],
                },
                {
                    title: "Chat-Python",
                    desc: "A small multi-user TCP chat I wrote while learning sockets and threads in Python, with a central server and one thread per connected client.",
                    link: "./projects/chat_python.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "DVRS",
                    desc: "A visual distance-vector routing simulator. You can edit the network and watch routes converge as the Bellman-Ford updates move between nodes.",
                    link: "./projects/dvrs.html",
                    tech: ["fa-brands fa-python"],
                },
                {
                    title: "Algorithms Course Project",
                    desc: "My final algorithms assignment: find the cheapest route across a rain-exposed city grid, using Dijkstra and a custom heap in C.",
                    link: "./projects/algorithm.html",
                    tech: ["fa-sharp fa-solid fa-c"],
                },
            ];

            const list = document.getElementById("projects-list");
            PROJECTS.forEach((p, i) => {
                const item = document.createElement("div");
                item.className = "project-item";
                const num = String(i + 1).padStart(2, "0");
                const externalLinks = (p.external || [])
                    .map(
                        ({ label, href }) =>
                            ` <a href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${p.title}: ${label}" class="ms-2 text-decoration-none text-secondary project-ext-link">${label} ↗</a>`,
                    )
                    .join("");
                item.innerHTML = `
            <h3><span class="project-num">${num}</span><a href="${p.link}" class="text-decoration-none">${p.title}</a>${externalLinks}</h3>
            <p class="mb-1">${p.desc}</p>
            <div class="tech-icons">${p.tech.map((cls) => `<i class="${cls}"></i>`).join("")}</div>
        `;
                list.appendChild(item);
            });
        </script>
    </body>
</html>
